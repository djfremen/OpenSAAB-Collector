name: Automated Collector
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'server/**', '.github/workflows/automated-collector.yml']
  push:
    branches: [main, 'codex/automated-usbpcap-collector']
    paths: ['desktop/**', 'server/**', '.github/workflows/automated-collector.yml']
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-test.txt
      - run: python -m pytest server/test_collector_api.py -q
  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test standalone Windows app
        shell: powershell
        run: ./desktop/test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSAAB-Collector-Windows
          path: desktop/bin/OpenSAAB-Collector.exe
